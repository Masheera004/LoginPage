<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta  author name="Masheera" content="login portal">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form actions="">
        <div class="container">
            <h1>Login</h1>
            <p>Please login to continue with us.</p>
            <hr/>


            <label for="fn"><b>Your Name</b></label>
            <input type="text" placeholder="First Name" name='fn' id='fn' required/>

            <!-- my input ;ine of codes -->
             <label for="emailid"><b>Email id</b></label>
             <input type="email"  placeholder="Enter your email" name="userEmail" id="userEmail" required>

             <!-- my input ;ine of codes -->

            <label for="psw"><b>Password</b></label>
            <input type="password" placeholder="Enter password" name='psw' id='psw' required/>

            <label for="cpsw"><b>Confirm Password</b></label>
            <input type="password" placeholder="Confirm Password" name='cpsw' id='cpsw' required/>

            <hr/>

            <button class="registerbtn" type="submit">Register</button>
        </div>
    </form>
</body>
</html>
